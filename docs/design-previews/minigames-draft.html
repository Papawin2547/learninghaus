<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearningHaus — Universal Mini-Game Drafts (Any Subject)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f9f6;
      --surface: #ffffff;
      --surface-soft: #f0f6f0;
      --border: #dbe7dc;
      --primary: #34703b;
      --primary-hover: #295c2f;
      --primary-soft: #e7f4e8;
      --danger: #c63838;
      --danger-soft: #fdecec;
      --amber: #c2781a;
      --amber-soft: #fef4e4;
      --indigo: #3b4fb8;
      --indigo-soft: #eef1fc;
      --ink: #18291b;
      --muted: #5b705e;
      --shadow: 0 10px 28px rgba(27, 56, 31, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", "Noto Sans Thai", system-ui, sans-serif;
      background: radial-gradient(circle at top right, #e9f5ea 0%, var(--bg) 52%);
      color: var(--ink);
    }

    .shell {
      max-width: 1080px;
      margin: 0 auto;
      padding: 22px 20px 64px;
    }

    /* Top Bar */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: var(--primary);
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 16px rgba(52, 112, 59, 0.28);
    }
    .brand h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .brand p {
      margin: 2px 0 0;
      font-size: 12.5px;
      color: var(--muted);
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      font: 700 12.5px/1 inherit;
      cursor: pointer;
      transition: all 140ms ease;
    }
    .pill-btn:hover { border-color: #9ec8a2; background: var(--surface-soft); }
    .pill-btn.is-active { background: var(--primary); border-color: var(--primary); color: #fff; }

    /* Subject Pack Switcher Bar */
    .subject-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding: 10px 14px;
      border-radius: 16px;
      background: linear-gradient(135deg, #eef7ef 0%, #ffffff 100%);
      border: 1.5px solid #cfe3d1;
    }
    .subject-bar__label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--primary);
    }
    .subject-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .subject-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 33px;
      padding: 0 13px;
      border-radius: 999px;
      border: 1.5px solid #c9decb;
      background: #fff;
      color: #315336;
      font: 700 12px/1 inherit;
      cursor: pointer;
      transition: all 140ms ease;
    }
    .subject-chip:hover { background: #f2faf3; border-color: #8bc090; }
    .subject-chip.is-active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 4px 10px rgba(52, 112, 59, 0.24);
    }

    /* Stage Selector Tabs */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
      padding: 10px;
      border-radius: 16px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      box-shadow: 0 4px 12px rgba(27, 56, 31, 0.05);
    }
    .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 13px;
      border-radius: 12px;
      border: 1.5px solid transparent;
      background: transparent;
      color: var(--muted);
      font: 700 12.5px/1.2 inherit;
      cursor: pointer;
      transition: all 140ms ease;
    }
    .tab-btn:hover { background: var(--surface-soft); color: var(--ink); }
    .tab-btn.is-active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(52, 112, 59, 0.26);
    }
    .tab-stage {
      display: inline-grid;
      place-items: center;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(52, 112, 59, 0.12);
      color: var(--primary);
      font-size: 10.5px;
      font-weight: 800;
    }
    .tab-btn.is-active .tab-stage {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
    }

    /* Game Stage Shell */
    .stage-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .stage-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 18px 24px;
      background: linear-gradient(135deg, #f3faf3 0%, #ffffff 100%);
      border-bottom: 1.5px solid #e6f0e7;
    }
    .stage-head__left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .stage-badge {
      padding: 5px 11px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 11.5px;
      font-weight: 800;
    }
    .stage-title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }
    .stage-sub {
      margin: 3px 0 0;
      font-size: 12.5px;
      color: var(--muted);
    }
    .stage-stats {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .stat-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      font-size: 12px;
      font-weight: 800;
      color: var(--ink);
    }
    .stage-body {
      padding: 24px;
      min-height: 390px;
    }
    .schema-foot {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 24px;
      background: #f8fbf8;
      border-top: 1.5px solid #e7f0e8;
      font-size: 12px;
      color: var(--muted);
    }
    .schema-foot code {
      padding: 3px 8px;
      border-radius: 6px;
      background: #e9f3ea;
      color: #215728;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 11.5px;
      font-weight: 700;
    }

    .feedback-bar {
      margin-top: 16px;
      padding: 11px 15px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--surface-soft);
      color: var(--primary);
      border: 1.5px solid #cfe4d1;
    }
    .feedback-bar.is-error {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: #f3c1c1;
    }
    .feedback-bar.is-win {
      background: linear-gradient(135deg, #e6f6e8 0%, #f5fcf6 100%);
      color: #1f5826;
      border-color: #7cc083;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      flex: none;
      white-space: nowrap;
      height: 40px;
      padding: 0 18px;
      border: 0;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      font: 700 13px/1 inherit;
      cursor: pointer;
      transition: all 140ms ease;
    }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }

    /* GAME 1: PAIR MATCH */
    .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .match-col { display: flex; flex-direction: column; gap: 10px; }
    .match-col__label {
      font-size: 11.5px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--muted); margin-bottom: 2px;
    }
    .match-item {
      width: 100%; padding: 14px 16px; border-radius: 14px;
      border: 2px solid var(--border); background: #fff; text-align: left;
      font: 700 13.5px/1.35 inherit; color: var(--ink); cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      transition: all 140ms ease;
    }
    .match-item:hover:not(:disabled) { border-color: #8bc090; background: #f8fcf8; }
    .match-item.is-selected { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 0 0 3px rgba(52,112,59,0.14); }
    .match-item.is-matched { border-color: #84c18b; background: #edf8ee; color: #275b2d; opacity: 0.78; cursor: default; }
    .match-item.is-wrong { border-color: var(--danger); background: var(--danger-soft); animation: shake 260ms ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

    /* GAME 2: RAPID STAMP */
    .desk-wrap { max-width: 640px; margin: 0 auto; text-align: center; }
    .case-file {
      position: relative; padding: 26px 26px 56px; border-radius: 18px;
      border: 2px solid #d9e4d9; background: linear-gradient(180deg, #fcfdf9 0%, #f5f8f2 100%);
      box-shadow: 0 12px 24px rgba(24, 48, 28, 0.08); text-align: left; overflow: hidden;
    }
    .case-file__meta {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 11.5px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--muted); margin-bottom: 10px;
    }
    .case-file__title { margin: 0 0 8px; font-size: 19px; font-weight: 800; }
    .case-file__desc { margin: 0; font-size: 14px; line-height: 1.55; color: #3a4f3d; }
    .stamp-mark {
      position: absolute; bottom: 14px; right: 20px; padding: 6px 14px;
      border-radius: 10px; border: 4px solid currentColor;
      font-size: 15px; font-weight: 900; letter-spacing: 0.08em;
      transform: rotate(-8deg) scale(1.2); opacity: 0; pointer-events: none;
      transition: all 180ms cubic-bezier(0.2, 0.9, 0.3, 1.2);
    }
    .stamp-mark.is-visible { opacity: 0.94; transform: rotate(-6deg) scale(1); }
    .stamp-mark.is-left { color: #247230; background: rgba(231, 248, 233, 0.94); }
    .stamp-mark.is-right { color: #c63434; background: rgba(253, 234, 234, 0.94); }
    .stamp-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
    .stamp-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 52px; border-radius: 14px; border: 2px solid;
      font: 800 14.5px/1 inherit; cursor: pointer; transition: all 140ms ease;
    }
    .stamp-btn--left { background: #edf9ee; border-color: #6ab572; color: #1f5f28; }
    .stamp-btn--left:hover:not(:disabled) { background: #2f7237; border-color: #2f7237; color: #fff; }
    .stamp-btn--right { background: #fef0f0; border-color: #e68a8a; color: #b42828; }
    .stamp-btn--right:hover:not(:disabled) { background: #c63838; border-color: #c63838; color: #fff; }

    /* GAME 3: CATEGORY SORT */
    .sort-tray {
      padding: 16px; border-radius: 16px; background: var(--surface-soft);
      border: 1.5px dashed #bad4bd; margin-bottom: 18px; text-align: center;
    }
    .sort-active-card {
      display: inline-flex; flex-direction: column; gap: 4px; max-width: 460px;
      padding: 14px 20px; border-radius: 14px; background: #fff;
      border: 2px solid var(--primary); box-shadow: 0 6px 16px rgba(52, 112, 59, 0.14);
    }
    .sort-active-card strong { font-size: 15px; }
    .sort-active-card span { font-size: 12.5px; color: var(--muted); }
    .bucket-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .bucket-btn {
      display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
      min-height: 150px; padding: 14px; border-radius: 16px;
      border: 2px solid var(--border); background: #fff; text-align: left;
      cursor: pointer; transition: all 140ms ease;
    }
    .bucket-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.08); }
    .bucket-btn.tone-red { border-top: 5px solid #c63838; }
    .bucket-btn.tone-amber { border-top: 5px solid #d97706; }
    .bucket-btn.tone-blue { border-top: 5px solid #3b6fd8; }
    .bucket-btn.tone-green { border-top: 5px solid #2f8541; }
    .bucket-btn h4 { margin: 0; font-size: 13.5px; font-weight: 800; }
    .bucket-btn small { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
    .bucket-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; width: 100%; }
    .bucket-chip {
      padding: 3px 8px; border-radius: 999px; background: var(--primary-soft);
      color: var(--primary); font-size: 11px; font-weight: 700;
    }

    /* GAME 4: DECISION PATH */
    .meter-box {
      display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
      padding: 12px 16px; border-radius: 14px; background: var(--surface-soft);
    }
    .meter-track { flex: 1; height: 10px; border-radius: 999px; background: #dce7dd; overflow: hidden; }
    .meter-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, #4b9453, #2b6b33); transition: width 260ms ease; }
    .scenario-bubble {
      padding: 18px 20px; border-radius: 16px; border: 1.5px solid var(--border);
      background: #fbfdfb; margin-bottom: 14px;
    }
    .scenario-speaker {
      display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
      border-radius: 999px; background: var(--indigo-soft); color: var(--indigo);
      font-size: 11.5px; font-weight: 800; margin-bottom: 8px;
    }
    .scenario-bubble p { margin: 0; font-size: 14.5px; line-height: 1.55; }
    .scenario-choices { display: grid; gap: 10px; }
    .choice-card {
      width: 100%; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--border);
      background: #fff; text-align: left; font: 700 13.5px/1.4 inherit; color: var(--ink);
      cursor: pointer; transition: all 140ms ease;
    }
    .choice-card:hover { border-color: var(--primary); background: #f5fbf5; }

    /* GAME 5: RAPID BLITZ */
    .sprint-card {
      max-width: 640px; margin: 0 auto; padding: 26px; border-radius: 18px;
      border: 2px solid var(--border); background: linear-gradient(180deg, #ffffff 0%, #f6fbf6 100%);
      text-align: center;
    }
    .combo-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
      border-radius: 999px; background: var(--amber-soft); color: var(--amber);
      font-size: 12px; font-weight: 800; margin-bottom: 14px;
    }
    .sprint-statement { margin: 0 0 22px; font-size: 18.5px; font-weight: 800; line-height: 1.45; }

    /* GAME 6: SPOT THE CLUES */
    .mock-spec { border-radius: 18px; border: 2px solid #d5e2d7; background: #fbfdfb; overflow: hidden; }
    .mock-spec__bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 18px; background: #1e3322; color: #fff; font-size: 13px; font-weight: 700;
    }
    .mock-spec__grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 18px; }
    .hotspot {
      padding: 14px 16px; border-radius: 14px; border: 2px dashed #c2d4c4;
      background: #fff; text-align: left; cursor: pointer; transition: all 140ms ease;
    }
    .hotspot:hover:not(:disabled) { border-style: solid; border-color: var(--primary); }
    .hotspot strong { display: block; font-size: 13.5px; margin-bottom: 4px; color: var(--ink); }
    .hotspot span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
    .hotspot.is-flag-found { border-style: solid; border-color: var(--danger); background: var(--danger-soft); }
    .hotspot.is-safe-click { border-style: solid; border-color: #7bb882; background: #eef8ef; }

    /* GAME 7: STEP SEQUENCE */
    .order-slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
    .order-slot {
      min-height: 92px; padding: 12px; border-radius: 14px; border: 2px dashed #bdd5c0;
      background: var(--surface-soft); display: flex; flex-direction: column; gap: 6px;
    }
    .order-slot.is-filled { border-style: solid; border-color: var(--primary); background: #eef8ef; }
    .order-slot__num { font-size: 11px; font-weight: 800; color: var(--primary); text-transform: uppercase; }
    .order-slot__text { font-size: 12.5px; font-weight: 700; color: var(--ink); }
    .order-pool { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .order-tile {
      padding: 14px 16px; border-radius: 14px; border: 2px solid var(--border);
      background: #fff; font: 700 13.5px/1.35 inherit; text-align: left; color: var(--ink);
      cursor: pointer; transition: all 140ms ease;
    }
    .order-tile:hover:not(:disabled) { border-color: var(--primary); background: #f6fbf6; }
    .order-tile:disabled { opacity: 0.45; cursor: default; }

    @media (max-width: 780px) {
      .match-grid, .bucket-grid, .mock-spec__grid, .order-slots, .order-pool { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="12" x="3" y="6" rx="2"/><path d="M7 12h4"/><path d="M9 10v4"/><circle cx="15" cy="11" r="1"/><circle cx="17" cy="13" r="1"/></svg>
        </span>
        <div>
          <h1 id="page-title">Universal Mini-Game Templates</h1>
          <p id="page-sub">Reusable across ANY course subject — switch the demo subject pack below to test the same 7 engines</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="pill-btn is-active" type="button" data-lang="en">English (EN)</button>
        <button class="pill-btn" type="button" data-lang="th">ภาษาไทย (TH)</button>
      </div>
    </header>

    <!-- LIVE SUBJECT SWITCHER -->
    <section class="subject-bar" aria-label="Sample subject packs">
      <span class="subject-bar__label" id="subject-bar-label">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        <span>Try Any Subject Pack:</span>
      </span>
      <div class="subject-chips" id="subject-chips"></div>
    </section>

    <nav class="tabs" id="game-tabs" aria-label="Universal mini-game engines"></nav>

    <main class="stage-card">
      <div class="stage-head">
        <div class="stage-head__left">
          <span class="stage-badge" id="stage-badge">Stage 2</span>
          <div>
            <h2 class="stage-title" id="stage-title">Pair Match</h2>
            <p class="stage-sub" id="stage-sub"></p>
          </div>
        </div>
        <div class="stage-stats">
          <span class="stat-chip" id="stage-score">Score: 0</span>
          <button class="pill-btn" type="button" id="stage-reset">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            <span id="reset-label">Reset</span>
          </button>
        </div>
      </div>
      <div class="stage-body" id="stage-body"></div>
      <footer class="schema-foot" id="schema-foot"></footer>
    </main>
  </div>

  <script>
    let lang = "en";
    let activeSubject = "ai";
    let activeGame = "matching";
    const t = (en, th) => (lang === "th" ? th : en);

    const SUBJECTS = [
      { id: "ai", nameEn: "AI Law", nameTh: "กฎหมาย AI" },
      { id: "science", nameEn: "Biology & Science", nameTh: "วิทยาศาสตร์ & ชีววิทยา" },
      { id: "coding", nameEn: "Web Programming", nameTh: "การเขียนโปรแกรม" },
      { id: "english", nameEn: "English Language", nameTh: "ภาษาอังกฤษ" }
    ];

    const GAMES = [
      {
        id: "matching",
        stageEn: "Stage 2", stageTh: "ด่าน 2",
        nameEn: "Pair Match", nameTh: "จับคู่ความสัมพันธ์",
        subEn: "Universal 1-to-1 matching: link terms, formulas, vocabulary, or concepts to their meanings.",

                { textEn: "I have no idea, ask someone else.", textTh: "ไม่รู้เหมือนกัน ไปถามคนอื่นเอาเองนะ", delta: -25, noteEn: "Sounds dismissive in a workplace setting.", noteTh: "ฟังดูปัดความรับผิดชอบ ไม่เหมาะกับการสื่อสารในงาน" }
              ]
            }
          ]
        },
        sprint: [
          { qEn: "'Their', 'There', and 'They're' all have the exact same meaning.", qTh: "คำว่า Their, There และ They're มีความหมายเหมือนกันทั้งหมด", ans: false },
          { qEn: "'An' is used before vowel sounds, such as 'an hour' and 'an umbrella'.", qTh: "ใช้ 'an' นำหน้าเสียงสระ เช่น an hour และ an umbrella", ans: true },
          { qEn: "The past tense of 'teach' is 'taught'.", qTh: "รูปอดีต (Past Tense) ของคำว่า teach คือ taught", ans: true }
        ],
        inspector: {
          barTitle: "Draft Email — Proofreading Check",
          goalEn: "Tap the 3 grammar / tone mistakes", goalTh: "คลิกจับผิด 3 จุดภาษาและการใช้คำ",
          spots: [
            { id: "s1", titleEn: "\"I look forward to hear...\"", titleTh: "\"I look forward to hear...\"", descEn: "Should be 'look forward to hearing' (gerund after 'to').", descTh: "หลัง look forward to ต้องตามด้วย V-ing (hearing)", isTarget: true },
            { id: "s2", titleEn: "\"Dear Ms. Tanaka,\"", titleTh: "\"Dear Ms. Tanaka,\"", descEn: "Polite and standard formal email greeting.", descTh: "คำทักทายอีเมลทางการที่สุภาพและถูกต้อง", isTarget: false },
            { id: "s3", titleEn: "\"Please find attach file\"", titleTh: "\"Please find attach file\"", descEn: "Missing past participle — should be 'attached file'.", descTh: "ควรใช้คำคุณศัพท์ 'attached file'", isTarget: true },
            { id: "s4", titleEn: "\"SEND THIS ASAP!!!\"", titleTh: "\"SEND THIS ASAP!!!\"", descEn: "All-caps with triple exclamation feels aggressive.", descTh: "พิมพ์ตัวใหญ่ทั้งหมดและใส่เครื่องหมายตกใจซ้ำดูไม่สุภาพ", isTarget: true }
          ]
        },
        order: [
          { rank: 1, en: "Write a Clear Subject & Greeting", th: "ตั้งหัวเรื่องให้ชัดและทักทายสุภาพ" },
          { rank: 2, en: "State Your Main Purpose First", th: "แจ้งจุดประสงค์หลักตั้งแต่ย่อหน้าแรก" },
          { rank: 3, en: "Add Key Details & Next Action", th: "ให้รายละเอียดสำคัญและสิ่งที่ต้องการให้ดำเนินการ" },
          { rank: 4, en: "Close Politely & Proofread", th: "ลงท้ายอย่างสุภาพและตรวจทานก่อนส่ง" }
        ]
      }
    };

    const tabsEl = document.getElementById("game-tabs");
    const subjectChipsEl = document.getElementById("subject-chips");
    const bodyEl = document.getElementById("stage-body");
    const badgeEl = document.getElementById("stage-badge");
    const titleEl = document.getElementById("stage-title");
    const subEl = document.getElementById("stage-sub");
    const scoreEl = document.getElementById("stage-score");
    const schemaFootEl = document.getElementById("schema-foot");

    const setScore = (text) => { scoreEl.textContent = text; };
    const pack = () => PACKS[activeSubject];

    /* ==================== STATES ==================== */
    let matchState, stampState, sortState, scenState, sprintState, inspState, orderState;

    const resetAllStates = () => {
      matchState = null; stampState = null; sortState = null;
      scenState = null; sprintState = null; inspState = null; orderState = null;
    };

    /* 1. PAIR MATCH */
    const initMatching = () => {
      const data = pack().matching;
      matchState = {
        data,
        rightOrder: [data.pairs[2], data.pairs[0], data.pairs[3], data.pairs[1]],
        selectedLeft: null,
        matched: new Set(),
        wrongPair: null,
        mistakes: 0
      };
    };
    const renderMatching = () => {
      if (!matchState) initMatching();
      const s = matchState;
      setScore(t(`Matched: ${s.matched.size}/4`, `จับคู่แล้ว: ${s.matched.size}/4`));
      const done = s.matched.size === 4;
      bodyEl.innerHTML = `
        <div class="match-grid">
          <div class="match-col">
            <div class="match-col__label">${t(s.data.leftLabelEn, s.data.leftLabelTh)}</div>
            ${s.data.pairs.map((p) => `
              <button class="match-item${s.selectedLeft === p.id ? " is-selected" : ""}${s.matched.has(p.id) ? " is-matched" : ""}${s.wrongPair && s.wrongPair[0] === p.id ? " is-wrong" : ""}" data-left="${p.id}" ${s.matched.has(p.id) ? "disabled" : ""}>
                <span>${t(p.leftEn, p.leftTh)}</span>
                ${s.matched.has(p.id) ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M20 6 9 17l-5-5"/></svg>` : ""}
              </button>
            `).join("")}
          </div>
          <div class="match-col">
            <div class="match-col__label">${t(s.data.rightLabelEn, s.data.rightLabelTh)}</div>
            ${s.rightOrder.map((p) => `
              <button class="match-item${s.matched.has(p.id) ? " is-matched" : ""}${s.wrongPair && s.wrongPair[1] === p.id ? " is-wrong" : ""}" data-right="${p.id}" ${s.matched.has(p.id) ? "disabled" : ""}>
                <span>${t(p.rightEn, p.rightTh)}</span>
              </button>
            `).join("")}
          </div>
        </div>
        <div class="feedback-bar${done ? " is-win" : s.wrongPair ? " is-error" : ""}">
          <span>${done ? t(`All 4 pairs matched cleanly! (${s.mistakes} mistakes)`, `จับคู่ครบทั้ง 4 คู่เรียบร้อย! (ผิดพลาด ${s.mistakes} ครั้ง)`) : s.wrongPair ? t("Not a match — try pairing another card.", "ยังไม่ตรงกัน ลองจับคู่อันอื่นดูนะ") : s.selectedLeft ? t("Now pick the matching item on the right.", "เลือกคำตอบที่ตรงกันทางฝั่งขวาได้เลย") : t("Tap an item on the left to start matching.", "แตะเลือกการ์ดฝั่งซ้ายเพื่อเริ่มจับคู่")}</span>
        </div>
      `;
      bodyEl.querySelectorAll("[data-left]").forEach((btn) => {
        btn.onclick = () => { s.selectedLeft = btn.dataset.left; s.wrongPair = null; renderMatching(); };
      });
      bodyEl.querySelectorAll("[data-right]").forEach((btn) => {
        btn.onclick = () => {
          if (!s.selectedLeft) return;
          const rid = btn.dataset.right;
          if (rid === s.selectedLeft) { s.matched.add(rid); s.selectedLeft = null; s.wrongPair = null; }
          else { s.mistakes += 1; s.wrongPair = [s.selectedLeft, rid]; s.selectedLeft = null; }
          renderMatching();
        };
      });
    };

    /* 2. RAPID STAMP */
    const initStamp = () => {
      stampState = { data: pack().stamp, idx: 0, score: 0, lastStamp: null, lastCorrect: null };
    };
    const renderStamp = () => {
      if (!stampState) initStamp();
      const s = stampState;
      const d = s.data;
      const done = s.idx >= d.cases.length;
      setScore(t(`Score: ${s.score}/${d.cases.length}`, `ถูก: ${s.score}/${d.cases.length}`));
      if (done) {
        bodyEl.innerHTML = `
          <div class="desk-wrap">
            <div class="feedback-bar is-win" style="justify-content:center; padding:24px; flex-direction:column;">
              <strong style="font-size:18px;">${t(`Round Complete — ${s.score}/${d.cases.length} Accurate!`, `เคลียร์ครบทุกใบแล้ว — แม่นยำ ${s.score}/${d.cases.length}!`)}</strong>
              <button class="btn-primary" type="button" id="stamp-again" style="margin-top:8px;">${t("Play Again", "เล่นอีกครั้ง")}</button>
            </div>
          </div>
        `;
        document.getElementById("stamp-again").onclick = () => { initStamp(); renderStamp(); };
        return;
      }
      const c = d.cases[s.idx];
      bodyEl.innerHTML = `
        <div class="desk-wrap">
          <div class="case-file">
            <div class="case-file__meta">
              <span>${c.code}</span>
              <span>${t(`Card ${s.idx + 1} of ${d.cases.length}`, `ใบที่ ${s.idx + 1} จาก ${d.cases.length}`)}</span>
            </div>
            <h3 class="case-file__title">${t(c.titleEn, c.titleTh)}</h3>
            <p class="case-file__desc">${t(c.descEn, c.descTh)}</p>
            <div class="stamp-mark ${s.lastStamp === "left" ? "is-left is-visible" : s.lastStamp === "right" ? "is-right is-visible" : ""}">
              ${s.lastStamp === "left" ? t(d.leftStampEn, d.leftStampTh) : s.lastStamp === "right" ? t(d.rightStampEn, d.rightStampTh) : ""}
            </div>
          </div>
          <div class="stamp-actions">
            <button class="stamp-btn stamp-btn--left" type="button" data-stamp="left" ${s.lastStamp ? "disabled" : ""}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M20 6 9 17l-5-5"/></svg>
              <span>${t(d.leftBtnEn, d.leftBtnTh)}</span>
            </button>
            <button class="stamp-btn stamp-btn--right" type="button" data-stamp="right" ${s.lastStamp ? "disabled" : ""}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg>
              <span>${t(d.rightBtnEn, d.rightBtnTh)}</span>
            </button>
          </div>
          ${s.lastStamp ? `
            <div class="feedback-bar ${s.lastCorrect ? "is-win" : "is-error"}">
              <span>${s.lastCorrect ? t("Correct! ", "ถูกต้อง! ") : t("Not quite! ", "ยังไม่ถูก! ")}${t(c.whyEn, c.whyTh)}</span>
              <button class="btn-primary" type="button" id="stamp-next">${t("Next Card →", "ใบถัดไป →")}</button>
            </div>
          ` : ""}
        </div>
      `;
      bodyEl.querySelectorAll("[data-stamp]").forEach((btn) => {
        btn.onclick = () => {
          s.lastStamp = btn.dataset.stamp;
          s.lastCorrect = s.lastStamp === c.answer;
          if (s.lastCorrect) s.score += 1;
          renderStamp();
        };
      });
      const nextBtn = document.getElementById("stamp-next");
      if (nextBtn) nextBtn.onclick = () => { s.idx += 1; s.lastStamp = null; s.lastCorrect = null; renderStamp(); };
    };

    /* 3. CATEGORY SORT */
    const initSort = () => {
      const data = pack().sorting;
      const placed = {};
      data.buckets.forEach((b) => { placed[b.id] = []; });
      sortState = { data, idx: 0, wrong: false, placed };
    };
    const renderSort = () => {
      if (!sortState) initSort();
      const s = sortState;
      const items = s.data.items;
      const done = s.idx >= items.length;
      setScore(t(`Sorted: ${s.idx}/${items.length}`, `คัดแยกแล้ว: ${s.idx}/${items.length}`));
      const cur = items[s.idx];
      bodyEl.innerHTML = `
        <div class="sort-tray">
          ${done
            ? `<strong style="color:var(--primary); font-size:16px;">${t("All items sorted into their matching categories!", "คัดแยกการ์ดครบทุกหมวดหมู่เรียบร้อยแล้ว!")}</strong>`
            : `<div class="sort-active-card">
                 <strong>${t(cur.nameEn, cur.nameTh)}</strong>
                 <span>${t(cur.hintEn, cur.hintTh)}</span>
               </div>`
          }
        </div>
        <div class="bucket-grid">
          ${s.data.buckets.map((b) => `
            <button class="bucket-btn tone-${b.tone}" type="button" data-bucket="${b.id}" ${done ? "disabled" : ""}>
              <h4>${t(b.titleEn, b.titleTh)}</h4>
              <small>${t(b.subEn, b.subTh)}</small>
              <div class="bucket-chips">
                ${s.placed[b.id].map((it) => `<span class="bucket-chip">${t(it.nameEn, it.nameTh)}</span>`).join("")}
              </div>
            </button>
          `).join("")}
        </div>
        ${s.wrong ? `<div class="feedback-bar is-error"><span>${t("Wrong bucket! Try another category.", "ยังไม่ใช่กล่องนี้ ลองเลือกหมวดหมู่อื่นดูนะ")}</span></div>` : ""}
      `;
      bodyEl.querySelectorAll("[data-bucket]").forEach((btn) => {
        btn.onclick = () => {
          if (done) return;
          if (btn.dataset.bucket === cur.bucket) { s.placed[cur.bucket].push(cur); s.idx += 1; s.wrong = false; }
          else { s.wrong = true; }
          renderSort();
        };
      });
    };

    /* 4. DECISION PATH */
    const initScenario = () => {
      scenState = { data: pack().scenario, step: 0, meter: 70, lastNote: "" };
    };
    const renderScenario = () => {
      if (!scenState) initScenario();
      const s = scenState;
      const meterLabel = t(s.data.meterEn, s.data.meterTh);
      setScore(`${meterLabel}: ${s.meter}%`);
      const done = s.step >= s.data.steps.length;
      const cur = s.data.steps[s.step];
      bodyEl.innerHTML = `
        <div class="meter-box">
          <strong style="font-size:13px;">${meterLabel}</strong>
          <div class="meter-track"><div class="meter-fill" style="width:${Math.max(0, Math.min(100, s.meter))}%"></div></div>
          <strong style="font-size:13px; color:var(--primary);">${s.meter}%</strong>
        </div>
        ${done ? `
          <div class="feedback-bar is-win" style="flex-direction:column; padding:22px; text-align:center;">
            <strong style="font-size:16px;">${t(`Scenario Complete! Final ${s.data.meterEn}: ${s.meter}%`, `จบสถานการณ์จำลอง! ${s.data.meterTh}: ${s.meter}%`)}</strong>
            <span style="font-weight:500;">${s.lastNote}</span>
          </div>
        ` : `
          <div class="scenario-bubble">
            <span class="scenario-speaker">${cur.speaker}</span>
            <p>${t(cur.promptEn, cur.promptTh)}</p>
          </div>
          <div class="scenario-choices">
            ${cur.choices.map((ch, idx) => `
              <button class="choice-card" type="button" data-choice="${idx}">${t(ch.textEn, ch.textTh)}</button>
            `).join("")}
          </div>
          ${s.lastNote ? `<div class="feedback-bar"><span>${s.lastNote}</span></div>` : ""}
        `}
      `;
      bodyEl.querySelectorAll("[data-choice]").forEach((btn) => {
        btn.onclick = () => {
          const ch = cur.choices[Number(btn.dataset.choice)];
          s.meter = Math.max(0, Math.min(100, s.meter + ch.delta));
          s.lastNote = t(ch.noteEn, ch.noteTh);
          s.step += 1;
          renderScenario();
        };
      });
    };

    /* 5. RAPID BLITZ */
    const initSprint = () => {
      sprintState = { items: pack().sprint, idx: 0, combo: 0, points: 0, lastMsg: "", lastOk: true };
    };
    const renderSprint = () => {
      if (!sprintState) initSprint();
      const s = sprintState;
      setScore(t(`Points: ${s.points}`, `คะแนน: ${s.points}`));
      const done = s.idx >= s.items.length;
      if (done) {
        bodyEl.innerHTML = `<div class="feedback-bar is-win" style="justify-content:center; padding:24px;"><strong>${t(`Blitz Finished! Total Points: ${s.points}`, `จบสปรินต์! คะแนนรวม ${s.points} แต้ม`)}</strong></div>`;
        return;
      }
      const item = s.items[s.idx];
      bodyEl.innerHTML = `
        <div class="sprint-card">
          <span class="combo-pill">${t(`Combo x${Math.max(1, s.combo)} · Question ${s.idx + 1}/${s.items.length}`, `คอมโบ x${Math.max(1, s.combo)} · ข้อที่ ${s.idx + 1}/${s.items.length}`)}</span>
          <p class="sprint-statement">${t(item.qEn, item.qTh)}</p>
          <div class="stamp-actions">
            <button class="stamp-btn stamp-btn--left" type="button" data-tf="true">${t("TRUE", "จริง (TRUE)")}</button>
            <button class="stamp-btn stamp-btn--right" type="button" data-tf="false">${t("FALSE", "เท็จ (FALSE)")}</button>
          </div>
          ${s.lastMsg ? `<div class="feedback-bar ${s.lastOk ? "" : "is-error"}" style="margin-top:16px;"><span>${s.lastMsg}</span></div>` : ""}
        </div>
      `;
      bodyEl.querySelectorAll("[data-tf]").forEach((btn) => {
        btn.onclick = () => {
          if ((btn.dataset.tf === "true") === item.ans) {
            s.combo += 1;
            const gained = 100 * s.combo;
            s.points += gained;
            s.lastOk = true;
            s.lastMsg = t(`Correct! +${gained} pts (Combo x${s.combo})`, `ถูกต้อง! +${gained} แต้ม (คอมโบ x${s.combo})`);
          } else {
            s.combo = 0; s.lastOk = false;
            s.lastMsg = t("Combo reset! Keep going.", "คอมโบรีเซ็ต! ลุยต่อข้อถัดไป");
          }
          s.idx += 1;
          renderSprint();
        };
      });
    };

    /* 6. SPOT THE CLUES */
    const initInspector = () => {
      inspState = { data: pack().inspector, found: new Set(), safeClicked: new Set() };
    };
    const renderInspector = () => {
      if (!inspState) initInspector();
      const s = inspState;
      const totalTargets = s.data.spots.filter((x) => x.isTarget).length;
      const done = s.found.size === totalTargets;
      setScore(t(`Found: ${s.found.size}/${totalTargets}`, `พบแล้ว: ${s.found.size}/${totalTargets}`));
      bodyEl.innerHTML = `
        <div class="mock-spec">
          <div class="mock-spec__bar">
            <span>${s.data.barTitle}</span>
            <span>${t(s.data.goalEn, s.data.goalTh)}</span>
          </div>
          <div class="mock-spec__grid">
            ${s.data.spots.map((sp) => `
              <button class="hotspot${s.found.has(sp.id) ? " is-flag-found" : ""}${s.safeClicked.has(sp.id) ? " is-safe-click" : ""}" type="button" data-spot="${sp.id}" ${s.found.has(sp.id) || s.safeClicked.has(sp.id) ? "disabled" : ""}>
                <strong>${t(sp.titleEn, sp.titleTh)}</strong>
                <span>${t(sp.descEn, sp.descTh)}</span>
              </button>
            `).join("")}
          </div>
        </div>
        <div class="feedback-bar${done ? " is-win" : ""}">
          <span>${done ? t(`All ${totalTargets} target clues found!`, `พบครบทั้ง ${totalTargets} จุดสำคัญแล้ว ยอดเยี่ยมมาก!`) : t(`Found ${s.found.size} of ${totalTargets}. Safe items turn green if clicked.`, `พบแล้ว ${s.found.size} จาก ${totalTargets} จุด (จุดที่ปกติจะขึ้นสีเขียวเมื่อกด)`)}</span>
        </div>
      `;
      bodyEl.querySelectorAll("[data-spot]").forEach((btn) => {
        btn.onclick = () => {
          const sp = s.data.spots.find((x) => x.id === btn.dataset.spot);
          if (!sp) return;
          if (sp.isTarget) s.found.add(sp.id);
          else s.safeClicked.add(sp.id);
          renderInspector();
        };
      });
    };

    /* 7. STEP SEQUENCE */
    const initOrder = () => {
      const steps = pack().order;
      orderState = { correct: steps, shuffled: [steps[2], steps[0], steps[3], steps[1]], chosen: [], wrong: false };
    };
    const renderOrder = () => {
      if (!orderState) initOrder();
      const s = orderState;
      const done = s.chosen.length === 4;
      setScore(t(`Steps: ${s.chosen.length}/4`, `เรียงแล้ว: ${s.chosen.length}/4`));
      bodyEl.innerHTML = `
        <div class="order-slots">
          ${[0, 1, 2, 3].map((i) => `
            <div class="order-slot${s.chosen[i] ? " is-filled" : ""}">
              <span class="order-slot__num">${t(`Step ${i + 1}`, `ขั้นที่ ${i + 1}`)}</span>
              <span class="order-slot__text">${s.chosen[i] ? t(s.chosen[i].en, s.chosen[i].th) : t("Tap next step...", "แตะเลือกขั้นต่อไป...")}</span>
            </div>
          `).join("")}
        </div>
        <div class="order-pool">
          ${s.shuffled.map((st) => {
            const used = s.chosen.some((c) => c.rank === st.rank);
            return `<button class="order-tile" type="button" data-rank="${st.rank}" ${used ? "disabled" : ""}>${t(st.en, st.th)}</button>`;
          }).join("")}
        </div>
        <div class="feedback-bar${done ? " is-win" : s.wrong ? " is-error" : ""}">
          <span>${done ? t("Perfect sequence from Step 1 to Step 4!", "เรียงลำดับขั้นตอนตั้งแต่ขั้นที่ 1 ถึงขั้นที่ 4 ได้สมบูรณ์แบบ!") : s.wrong ? t("Not the next step — think about what comes first.", "ลำดับยังไม่ถูก ลองดูว่าขั้นไหนต้องมาก่อน") : t("Tap the tiles in chronological order from Step 1 to Step 4.", "แตะการ์ดด้านล่างเรียงลำดับตั้งแต่ขั้นที่ 1 ถึงขั้นที่ 4")}</span>
        </div>
      `;
      bodyEl.querySelectorAll("[data-rank]").forEach((btn) => {
        btn.onclick = () => {
          const rank = Number(btn.dataset.rank);
          const expected = s.chosen.length + 1;
          if (rank === expected) { s.chosen.push(s.correct[expected - 1]); s.wrong = false; }
          else { s.wrong = true; }
          renderOrder();
        };
      });
    };

    const renderAll = () => {
      document.documentElement.lang = lang;
      document.getElementById("page-title").textContent = t("Universal Mini-Game Templates", "ดราฟมินิเกมมาตรฐานสำหรับทุกวิชา");
      document.getElementById("page-sub").textContent = t(
        "Reusable across ANY course subject — switch the demo subject pack below to test the same 7 engines",
        "ใช้ได้กับบทเรียนทุกสาขา — ลองกดสลับวิชาตัวอย่างด้านล่างเพื่อดูมินิเกมทั้ง 7 แบบปรับตามเนื้อหาอัตโนมัติ"
      );
      document.getElementById("subject-bar-label").querySelector("span").textContent = t("Try Any Subject Pack:", "ลองสลับวิชาตัวอย่าง:");
      document.getElementById("reset-label").textContent = t("Reset", "เริ่มใหม่");

      document.querySelectorAll("[data-lang]").forEach((btn) => {
        btn.classList.toggle("is-active", btn.dataset.lang === lang);
      });

      subjectChipsEl.innerHTML = SUBJECTS.map((sub) => `
        <button class="subject-chip${sub.id === activeSubject ? " is-active" : ""}" type="button" data-subject="${sub.id}">
          <span>${t(sub.nameEn, sub.nameTh)}</span>
        </button>
      `).join("");
      subjectChipsEl.querySelectorAll("[data-subject]").forEach((btn) => {
        btn.onclick = () => {
          activeSubject = btn.dataset.subject;
          resetAllStates();
          renderAll();
        };
      });

      tabsEl.innerHTML = GAMES.map((g) => `
        <button class="tab-btn${g.id === activeGame ? " is-active" : ""}" type="button" data-game="${g.id}">
          <span class="tab-stage">${t(g.stageEn, g.stageTh)}</span>
          <span>${t(g.nameEn, g.nameTh)}</span>
        </button>
      `).join("");
      tabsEl.querySelectorAll("[data-game]").forEach((btn) => {
        btn.onclick = () => { activeGame = btn.dataset.game; renderAll(); };
      });

      const meta = GAMES.find((g) => g.id === activeGame) || GAMES[0];
      const subMeta = SUBJECTS.find((x) => x.id === activeSubject) || SUBJECTS[0];
      badgeEl.textContent = `${t(meta.stageEn, meta.stageTh)} · ${t(subMeta.nameEn, subMeta.nameTh)}`;
      titleEl.textContent = t(meta.nameEn, meta.nameTh);
      subEl.textContent = t(meta.subEn, meta.subTh);
      schemaFootEl.innerHTML = `<span>${t("Subject-Agnostic Engine", "เอนจินกลางใช้ได้ทุกวิชา")}</span><code>${t(meta.schemaEn, meta.schemaTh)}</code>`;

      if (activeGame === "matching") renderMatching();
      else if (activeGame === "stamp") renderStamp();
      else if (activeGame === "sorting") renderSort();
      else if (activeGame === "scenario") renderScenario();
      else if (activeGame === "sprint") renderSprint();
      else if (activeGame === "inspector") renderInspector();
      else if (activeGame === "order") renderOrder();
    };

    document.querySelectorAll("[data-lang]").forEach((btn) => {
      btn.onclick = () => { lang = btn.dataset.lang; renderAll(); };
    });

    document.getElementById("stage-reset").onclick = () => {
      if (activeGame === "matching") initMatching();
      else if (activeGame === "stamp") initStamp();
      else if (activeGame === "sorting") initSort();
      else if (activeGame === "scenario") initScenario();
      else if (activeGame === "sprint") initSprint();
      else if (activeGame === "inspector") initInspector();
      else if (activeGame === "order") initOrder();
      renderAll();
    };

    renderAll();
  </script>
</body>
</html>
